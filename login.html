<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Xưởng Cáp</title>
    <!-- Link nhúng Framework Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-slate-200">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-indigo-600 tracking-wide">⚡ XƯỞNG CÁP</h2>
            <p class="text-slate-500 text-sm mt-1">Hệ thống quản lý chấm công</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Số điện thoại</label>
                <input type="text" id="username" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" placeholder="Nhập SĐT..." required>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" placeholder="Nhập mật khẩu..." required>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition mt-6">
                ĐĂNG NHẬP
            </button>
        </form>

        <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 font-semibold hidden">Sai tài khoản hoặc mật khẩu!</p>
    </div>

    <!-- Thư viện và API Client -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
